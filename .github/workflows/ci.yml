name: CI

# 21 Aug 2026 — TWO OPERATING SYSTEMS, ONE ECOSYSTEM.
#
# This matrix is windows-latest + ubuntu-latest on CPython 3.12. Say plainly what
# that buys and what it does not: it catches path separators, case-sensitive
# filesystems, line endings and the drive-letter class of bug (a real one — see
# docs/KNOWN_FORK_FINDINGS.md #4, a test that asserted an UNWRITABLE path on
# Windows and a perfectly ordinary relative path on Linux). It does NOT buy
# independence. Same Python, same pins, same interpreter family, same repo. Two
# green checks that agree are one measurement reported twice. CONTRIBUTING.md
# says this out loud so nobody reads the badge as corroboration.
#
# WHAT IS A GATE AND WHAT IS NOT, stated per job rather than implied:
#   compile   HARD GATE. A red X is a real defect.
#   install   HARD GATE. `pip install -r requirements.txt` must succeed on both
#             OSes; the whole point of the 21 Aug rewrite of that file was that
#             it did not.
#   tests     INFORMATIONAL, and honest about it. The suite is 20 red on Windows
#             today (docs/KNOWN_FORK_FINDINGS.md). continue-on-error keeps the
#             JOB from blocking; the STEP still reports its real exit code, so
#             the annotation says what it found. NO `|| true` anywhere — that is
#             how this repo previously shipped a tests job that could not fail
#             and reported success over four failures.
#   ruff      INFORMATIONAL. 3311 findings measured 17 Aug 2026; no config is
#             committed on purpose, the raw number comes first.

on: [push, pull_request]

jobs:
  compile:
    name: compile every tracked .py (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: py_compile
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(p in f.parts for p in ('venv','venv312_metta','__pycache__','OLD','LEGACY')):
                  continue
              try: py_compile.compile(str(f), doraise=True)
              except Exception as e: bad.append(f"{f}: {e}")
          print(f"checked OK; broken: {len(bad)}")
          for b in bad: print(" ", b)
          sys.exit(1 if bad else 0)
          PY

  install:
    name: pip install -r requirements.txt (hard gate)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: install the pinned closure
        run: python -m pip install -r requirements.txt
      - name: the suite must at least COLLECT
        # 1332 tests on this machine, 21 Aug 2026, on both 3.14 and 3.12. A
        # collection error means a dependency is missing from requirements.txt —
        # which is exactly the state the fork test found that morning, and is a
        # defect in the file rather than in the test.
        run: python -m pytest test/ --collect-only -q

  tests:
    name: pytest (informational)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: pytest, network-marked tests excluded
        # -m "not network" deselects test/test_llm_models_exist.py, the only
        # module that makes a live outbound request. It skips itself without
        # credentials anyway; the marker means the runner does not spend a
        # timeout finding that out. test/test_ci_contract.py fails if the marker
        # ever stops matching anything while such tests still exist.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest test/ -q -m "not network"

  ruff:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check .
