name: CI — compile gate + tests
# 14 Aug 2026 (Claude): first CI for the public repo. Two jobs, honestly labelled:
#  - compile: HARD gate — every .py must parse; a red X here is a real defect.
#  - tests: informational for now (repo tests assume local data/venv quirks);
#    promoted to a hard gate once they run clean on a bare runner.
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile every tracked .py (hard gate)
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if any(p in f.parts for p in ('venv','venv312_metta','__pycache__','OLD','LEGACY')):
                  continue
              try: py_compile.compile(str(f), doraise=True)
              except Exception as e: bad.append(f"{f}: {e}")
          print(f"checked OK; broken: {len(bad)}")
          for b in bad: print(" ", b)
          sys.exit(1 if bad else 0)
          PY
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until green on a bare runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest requests feedparser psutil
      - name: pytest (informational)
        # 17 Aug 2026: this step reported a green check it had not earned. It named
        # tests/ — a directory git does not carry, so on a fresh checkout pytest
        # exited "file or directory not found" — and then `|| true` swallowed that
        # exit code, as it swallowed every real failure behind it. With
        # continue-on-error already set, the job could not go red for any reason, and
        # was reporting success while the suite had 4 failures.
        # continue-on-error stays: this is still informational, not a gate. But the
        # step must now show what it found.
        run: pytest test/ -q
  ruff:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational, like tests — not a gate yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - name: ruff (informational)
        # NO `|| true`. continue-on-error keeps the JOB from blocking the run, but the
        # STEP reports its real exit code, so the annotation says what ruff found. The
        # two are not the same thing and conflating them is how this repo ended up with
        # a tests job that could not fail — see the comment above.
        #
        # Measured 17 Aug 2026 before wiring this up, so the first red is not a
        # surprise: `ruff check .` reports 3311 findings over 393 files (venv/ is
        # excluded automatically; there is no ruff config in this repo). Note that
        # ruff 0.16's out-of-the-box rule set is much wider than the documented
        # E4,E7,E9,F default — restricted to exactly those four, the count is 754.
        # No config is committed yet, deliberately: the raw number comes first.
        run: ruff check .
