[pytest]
# Marker registry. Added 21 Aug 2026 alongside the two-OS CI matrix, so that
# `-m "not network"` means something rather than silently matching nothing.
#
# HOW MANY TESTS CARRY EACH MARKER IS PART OF THE POINT. If `network` ever drifts
# back to zero while tests still call out, the CI flag becomes decoration.
# test/test_ci_contract.py holds that: it counts the marked tests and requires
# the count to be non-zero and to cover every module that makes a live request.
markers =
    render_sweep: drives the real page in a real headless Chrome and judges it
             by what the RENDERER reports — computed style, bounding boxes,
             element counts, requests actually issued. Never an in-memory
             property: the dead CLOSE button shipped behind a test asserting
             `wrap.hidden === true` while the panel stayed 742px wide.
             SKIPS LOUDLY, with the reason named, where no browser exists.
    network: reaches a real remote host. Skipped in CI (`-m "not network"`).
             A test with this marker must still SKIP, not fail, when the
             credentials or the host are absent — CI is not the only place
             without a network.
