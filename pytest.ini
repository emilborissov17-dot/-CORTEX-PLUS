[pytest]
# Marker registry. Added 21 Aug 2026 alongside the two-OS CI matrix, so that
# `-m "not network"` means something rather than silently matching nothing.
#
# HOW MANY TESTS CARRY EACH MARKER IS PART OF THE POINT. If `network` ever drifts
# back to zero while tests still call out, the CI flag becomes decoration.
# test/test_ci_contract.py holds that: it counts the marked tests and requires
# the count to be non-zero and to cover every module that makes a live request.
markers =
    render_sweep: drives the real page in a real headless Chrome and judges it
             by what the RENDERER reports — computed style, bounding boxes,
             element counts, requests actually issued. Never an in-memory
             property: the dead CLOSE button shipped behind a test asserting
             `wrap.hidden === true` while the panel stayed 742px wide.
             SKIPS LOUDLY, with the reason named, where no browser exists.
    live_state: THE OUTCOME VARIES WITH THE WORLD, NOT WITH THE CODE. Excluded
             from the gating suite (`-m "not live_state"`, tools/suite_gate.py)
             and run by tools/live_monitor.py instead. ITEM 45, 30 Aug 2026.
             Kimi: "A gating test must be deterministic; any test whose outcome
             varies with live state is an operational monitor, not a correctness
             gate." And: "A baseline amended after every cycle is a tolerance
             log, not a baseline."
             CHOSEN BY MEASUREMENT, NOT BY GUESS. 453 tests READ memory/,
             snapshots/, output/ or cortex_memory/ at run time — 13% of the
             suite — so reading live state cannot be the criterion or there
             would be no gate left. The criterion is that the outcome MOVES:
             across 19 recorded VALID runs, 52 tests failed in every one (stable
             red, real defects) and 13 flapped. Of those 13, nine both flapped
             AND were seen reading live state; three flapped while reading none
             of it and were traced to code changes in this repo (the ITEM 34
             ratchet, and two ITEM 44.1 tests) — those three are the control
             that shows the discriminator works.
             THE LIST IS EMPIRICAL AND WILL GROW. Eight of the nine flapped only
             1-5 times in 19 runs; a test that reads live state but has not yet
             met a world that breaks it looks stable today. Treating this
             membership as settled by one measurement would make the monitor the
             tolerance log again, one level down. Expect to add to it, and add
             by the same method rather than by argument.
             ONE TEST THAT FLAPPED AND READS LIVE STATE IS DELIBERATELY NOT
             MARKED, AND MUST NOT BE "FIXED" BY MARKING IT:
             test_resolve_ideas_defects.py::test_the_unrestricted_hit_rate_is_
             never_printed. Kimi ruled it a TEST DEFECT, not live state —
             "a brittle grep without context; the collision is a test-quality
             failure, not a live-state mutation." It asserts the bare string
             "7.1%" never reaches stdout, and failed when an unrelated statistic
             printed FRAGILITY: 7.1%. Marking it would bury a real defect in the
             bucket we agreed to tolerate. It stays RED IN THE GATE until
             ITEM 46 rewrites it to assert against a specific output location.
    network: reaches a real remote host. Skipped in CI (`-m "not network"`).
             A test with this marker must still SKIP, not fail, when the
             credentials or the host are absent — CI is not the only place
             without a network.
