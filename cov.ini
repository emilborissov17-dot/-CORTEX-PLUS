# Coverage settings for a whole-cycle run. A FILE, not flags: the cycle spawns
# child processes, and a child reads this through COVERAGE_PROCESS_START --
# flags on the parent's command line never reach it. Children that are not
# measured come back 0% and read as dead code that is in fact alive.
#
#   set COVERAGE_PROCESS_START=<repo>\cov.ini
#   set PYTHONPATH=<repo>\covhelpers
#   venv\Scripts\coverage.exe run --rcfile=cov.ini fast_cycle_runner.py
#
# parallel = True is not optional here: every process writes its own
# .coverage.<host>.<pid>.<n> and `coverage combine` merges them. Without it the
# last process to exit overwrites everyone else's data.
[run]
parallel = True
# Write the data on a polite termination. Coverage has NO periodic flush --
# verified: a process killed outright loses everything it collected, which is
# how the whole parent dataset of the 18:44 run was lost. This does not save an
# OOM kill (SIGKILL is not catchable); it saves a supervisor timeout or a Ctrl-C.
sigterm = True
branch = True
source = core,tools,experiments,scripts
omit = */test/*,*/venv/*,*/sitecustomize.py
