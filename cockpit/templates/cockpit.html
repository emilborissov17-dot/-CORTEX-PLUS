<!doctype html>
<!--
  cockpit/templates/cockpit.html — one local window over memory/.

  TABS, NOT A SCROLL. Eleven panels stacked in one column meant the terminal was
  panel 11 and the ask box was buried inside panel 9: everything was READABLE and
  nothing was USABLE. Only the active tab renders — not hidden with CSS, actually
  not built — so a tab you are not looking at costs nothing to draw and nothing to
  fetch.

  LOCAL-FIRST. Every asset comes from cockpit/static/. No CDN link exists in this
  file, so the page renders with the network unplugged and cannot be changed by a
  third party between one load and the next.

  A panel whose data file does not exist renders a "no data yet" card naming the
  missing path. It never renders zeros and never borrows a neighbour's file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CORTEX++ cockpit</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/xterm.css">
<style>
  :root{
    --bg:#0b0e12; --panel:#12161c; --line:#1e242c; --ink:#c7d0da; --dim:#6b7683;
    --grn:#4ec46e; --yel:#d8b13a; --red:#e05a5a; --blu:#5aa9e0; --mag:#b07ad8;
    --bar:56px; --ctl:64px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 "Cascadia Mono",Consolas,ui-monospace,monospace;
       padding-top:var(--bar);padding-bottom:var(--ctl)}

  /* ── the fixed top bar ─────────────────────────────────────────────── */
  header{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:30;
         background:#0d1116;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:14px;padding:0 14px}
  h1{font-size:13px;margin:0;letter-spacing:.14em;white-space:nowrap}
  .meta{color:var(--dim);font-size:11px;white-space:nowrap}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  /* GLASS: raw means raw. No wrapping, no prettifying. */
  .spdrow{display:flex;gap:4px;margin:4px 0}
  .spd{font-size:10px;padding:1px 6px;opacity:.6}
  .spd.on{opacity:1;font-weight:bold}
  .sline{white-space:pre;font-size:11px;line-height:1.3}
  .sline.ch-S{color:#e8b04b}
  .quiet{padding:8px 0;font-size:12px;opacity:.75}
  .rx{margin:8px 0;padding:6px 0;border-top:1px solid #222}
  .rxlines{font-size:10px;opacity:.55;white-space:pre;margin:3px 0;max-height:9em;overflow:auto}
  /* VERBATIM. No ellipsis, no clamp, no prettifying. */
  .rxanswer{font-size:12px;white-space:pre-wrap;line-height:1.45}
  .sparks{max-height:22vh;overflow:auto;margin:4px 0}
  .spark{font-size:11px;line-height:1.35;opacity:.85}
  .spark.fresh{opacity:1;background:#1a1408}
  .counters{border-top:1px solid #222;margin-top:4px;padding-top:4px;font-size:11px}
  .ok{color:#6db56d}
  .bad{color:#c98b3a}
  pre.raw{max-height:52vh;overflow:auto;white-space:pre;font-size:11px;
          line-height:1.35;margin:6px 0 0;padding:6px;background:#0b0b0b}
  table.tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
  table.tbl th{text-align:left;opacity:.6;font-weight:normal;padding:2px 6px 2px 0}
  table.tbl td{padding:1px 6px 1px 0;white-space:nowrap}
  .tab{background:#141a21;border:1px solid var(--line);color:var(--dim);
       padding:5px 10px;border-radius:3px;cursor:pointer;font:inherit;font-size:11px;
       display:flex;align-items:center;gap:6px;letter-spacing:.08em}
  .tab:hover{border-color:#39424e;color:var(--ink)}
  .tab.on{border-color:var(--blu);color:var(--blu);background:#101820}
  .tab .k{opacity:.45;font-size:10px}
  .dot{width:6px;height:6px;border-radius:50%;background:#2c343d}
  .dot.has{background:var(--grn)}

  /* ── the docked control bar ────────────────────────────────────────── */
  footer{position:fixed;bottom:0;left:0;right:0;height:var(--ctl);z-index:30;
         background:#0d1116;border-top:1px solid var(--line);
         display:flex;flex-direction:column;justify-content:center;gap:4px;
         padding:6px 14px}
  .ctlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctlnote{color:var(--dim);font-size:10px}
  #askbox{flex:1;min-width:220px;background:#0a0d11;border:1px solid var(--line);
          color:var(--ink);padding:5px 8px;border-radius:3px;font:inherit}
  /* ITEM 6b — it was a <span>. The count was correct, /api/expression/seen was
     wired and tested, and NOTHING EVER CALLED IT: the number could only ever go
     up, so the one control that says "I have read this" did not exist and the
     count stopped meaning anything after the first day. */
  .unread{color:var(--yel);font-size:11px;white-space:nowrap;cursor:pointer}
  .unread.zero{color:var(--dim);cursor:default}
  .unread:disabled{cursor:default}

  /* ── panels ────────────────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
        gap:12px;padding:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;
         padding:10px 12px;overflow:hidden}
  .panel h2{font-size:11px;letter-spacing:.16em;color:var(--dim);margin:0 0 8px;
            text-transform:uppercase;font-weight:600}
  .wide{grid-column:1/-1}
  .nodata{color:var(--dim);border:1px dashed var(--line);border-radius:4px;
          padding:12px;font-size:12px}
  .nodata b{color:var(--yel)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:2px 6px;text-align:left;vertical-align:top;border-bottom:1px solid #171c22}
  th{color:var(--dim);font-weight:500}
  .bar{height:8px;background:#1a2029;border-radius:2px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--grn)}
  .bar.warn>i{background:var(--yel)} .bar.bad>i{background:var(--red)}
  .pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;
        border:1px solid var(--line);color:var(--dim);margin-right:4px}
  .pill.on{color:var(--grn);border-color:#245c33}
  .pill.warn{color:var(--yel);border-color:#5c4d24}
  .pill.bad{color:var(--red);border-color:#5c2424}
  .steps{display:flex;flex-wrap:wrap;gap:3px}
  .step{width:11px;height:11px;border-radius:2px;background:#232a33}
  .step.done{background:var(--grn)} .step.current{background:var(--yel);box-shadow:0 0 0 2px #4a3d17}
  /* ITEM 6c — `passed` means "the heartbeat is past this step", which is
     INFERRED FROM POSITION and not a checkpoint. The API has computed it since
     22 Aug and the page rendered only done/current/todo, so the weaker evidence
     never reached the reader. It must not look like `done`: a hollow outline in
     the same green says "we assume so", a filled square says "it is on record". */
  .step.passed{background:transparent;box-shadow:inset 0 0 0 1.5px #245c33}
  /* PART 1 — doors, and the landing they scroll to */
  .jump{background:none;border:none;color:var(--blu);font:inherit;cursor:pointer;
        padding:0 2px;text-decoration:underline dotted}
  .jump:hover{color:#8ecbf5}
  .panel.landed{outline:1px solid var(--blu);outline-offset:2px}
  button.degchip{cursor:pointer;font-family:inherit}
  button.degchip.on{color:var(--yel);border-color:var(--yel)}
  .degcard{border-left:2px solid #5c4d24;padding:4px 0 4px 8px;margin-bottom:8px}
  tr.deghit td{background:#2a2110}
  tr.prow{cursor:pointer}
  tr.prow.open td{background:#161c24}
  tr.detail td{background:#0e1218}
  /* PART 2 — A DESCRIPTION IS NOT A LABEL.
     Step descriptions were cut at 70 characters in JavaScript, so the end of
     every sentence was destroyed before CSS ever saw it. The slice is gone; this
     is what lets the rest of the sentence land. `word-break` rather than
     `break-all` so a path breaks at its separators and stays readable. */
  td.full{white-space:normal;overflow-wrap:anywhere;word-break:normal;
          max-width:0;width:100%}
  .full{white-space:pre-wrap;overflow-wrap:anywhere}

  /* THE WHOLE ROW, BOTH COLUMNS. A hover that lit only the cell under the
     pointer let the eye pair a step with the description of its neighbour —
     which on a 31-row table is not a cosmetic problem. Pure CSS: no handler, so
     it survives every re-render for free. */
  tbody tr:hover > td, table tr:hover > td{background:#1a2028}
  tr.detail:hover > td{background:#0e1218}
  tr.prow.open:hover > td{background:#1d242e}

  .needle{font-size:32px;font-weight:700}
  .needle.bad{color:var(--red)} .needle.ok{color:var(--grn)}
  a{color:var(--blu)}
  .invalid{color:var(--red);font-weight:700}
  .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .col h3{font-size:10px;letter-spacing:.1em;color:var(--dim);margin:0 0 4px}
  .stream{height:calc(100vh - var(--bar) - var(--ctl) - 150px);min-height:260px;
          overflow-y:auto;background:#080a0d;border:1px solid var(--line);
          padding:6px;border-radius:3px}
  .ln{white-space:pre-wrap;margin:0 0 2px}
  .ln .pre{color:var(--dim)}
  .measurement{font-size:11px;color:#8c96a3}
  .mediation{color:var(--yel)}
  .expression{color:var(--blu);font-weight:700;font-family:system-ui,sans-serif}
  /* ITEM 4 — the window RENDERS the streams the system already writes. The rung
     is what colours a row, because the rung is the thing a reader needs at a
     glance: r0 measured, r1 the system reading the world, r2 the system
     reading itself. The source tag is printed beside it, never inferred. */
  .tl{white-space:pre-wrap;margin:0 0 2px;font-size:12px;line-height:1.35}
  .tl .pre{color:#5d6774}
  .tl .src{display:inline-block;min-width:112px;color:var(--dim)}
  .tl.r0{font-size:11px;color:#79828e}
  .tl.r1{color:#cfd6de}
  .tl.r2{color:var(--blu);font-weight:600}
  .tl.s-phase_debrief .src{color:var(--blu)}
  .tl.s-autopsy{color:var(--red)}
  .tl.s-reconsider .src{color:var(--yel)}
  .tl.s-expression{font-family:system-ui,sans-serif}
  .srcstate{font-size:10px;color:var(--dim)}
  .srcstate b.missing{color:var(--red)} .srcstate b.silent{color:var(--yel)}
  .srcstate b.speaking{color:var(--grn)}
  button{background:#1a212a;border:1px solid var(--line);color:var(--ink);
         padding:4px 9px;border-radius:3px;cursor:pointer;font:inherit;font-size:11px}
  button:hover{border-color:#39424e}
  button.active{border-color:var(--blu);color:var(--blu)}
  .sw{border-color:#5c2424;color:var(--dim)}
  .sw.on{border-color:var(--grn);color:var(--grn)}
  details summary{cursor:pointer;color:var(--dim);font-size:11px}
  .panes,.pane{height:calc(100vh - var(--bar) - var(--ctl) - 150px);min-height:280px}
  .termstatus{font-size:11px;color:var(--yel);background:#0a0d11;border:1px solid var(--line);
              border-bottom:none;border-radius:3px 3px 0 0;padding:3px 8px;min-height:20px}
  .b-green{color:var(--grn)} .b-amber{color:var(--yel)} .b-red{color:var(--red)}
  .foot{color:var(--dim);font-size:11px;padding:4px 0}
</style>
</head>
<body>

<header>
  <h1>CORTEX++</h1>
  <span class="meta" id="clock">—</span>
  <span class="meta" id="panelstat">—</span>
  <nav id="tabs"></nav>
</header>

<main id="view"><div class="grid"><section class="panel">loading…</section></div></main>

<footer>
  <div class="ctlrow">
    <input type="text" id="askbox" placeholder="ask — prefix DEEP: to send it to the 8b batch window">
    <button id="asksend">ask</button>
    <button class="unread zero" id="unread" title="mark every expression line on screen as seen">0 unread</button>
    <span style="width:12px"></span>
    <button class="cmd" data-cmd="venv\Scripts\python.exe supervisor.py --status">supervisor status</button>
    <button class="cmd" data-cmd="venv\Scripts\python.exe fast_cycle_runner.py">run full cycle</button>
    <button class="cmd" data-cmd="claude">claude code</button>
    <button class="cmd" data-cmd="git status">git status</button>
    <span style="width:12px"></span>
    <button class="sw" id="swmic">MIC OFF</button>
    <button class="sw" id="swcam">CAM OFF</button>
  </div>
  <div class="ctlnote">buttons type the command; you press Enter. &nbsp;·&nbsp;
    keys 1-7 switch tabs &nbsp;·&nbsp; mic and camera ask before switching on</div>
</footer>

<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = async u => (await fetch(u)).json();

const TABS = [
  {id:'overview',   name:'OVERVIEW'},
  {id:'cycle',      name:'CYCLE'},
  {id:'world',      name:'WORLD'},
  {id:'body',       name:'BODY'},
  {id:'expression', name:'EXPRESSION'},
  {id:'pending',    name:'PENDING'},
  {id:'glass',      name:'GLASS'},
  {id:'terminal',   name:'TERMINAL'},
];
const KEY = 'cortex.cockpit.tab';
const SESSION_TOKEN = '__COCKPIT_TOKEN__';   // injected by the server
const TERM_TABS = ['powershell','wsl','claude'];
let curTab = 'powershell';
let active = localStorage.getItem(KEY) || 'overview';
if (!TABS.some(t => t.id === active)) active = 'overview';
let hasData = {};

function drawTabs(){
  $('#tabs').innerHTML = TABS.map((t,i) =>
    `<button class="tab ${t.id===active?'on':''}" data-tab="${t.id}">
       <span class="dot ${hasData[t.id]?'has':''}"></span>${t.name}<span class="k">${i+1}</span>
     </button>`).join('');
  document.querySelectorAll('.tab').forEach(b =>
    b.onclick = () => switchTo(b.dataset.tab));
}

function switchTo(id){
  if(!TABS.some(t=>t.id===id)) return;
  active = id;
  localStorage.setItem(KEY, id);
  drawTabs();
  /* RETURNED, so a caller can wait for the tab it just asked for. render() is
     async and replaces #view wholesale; without the promise, anything that acts
     on the new tab acts on the old tab's HTML. */
  return render();
}

document.addEventListener('keydown', e => {
  if(document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.target && e.target.closest && e.target.closest('#term')) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= TABS.length) switchTo(TABS[n-1].id);
});

/* A count that is also its own door. A zero is NOT a door: there is nothing to
   look at, and a control that leads to an empty list teaches the reader to
   distrust the ones that do not. */
function jumpRow(label, n, tab, anchor){
  const has = Number(n) > 0;
  return `<tr><td>${esc(label)}</td><td>${has
    ? `<button class="jump" data-tab="${esc(tab)}" data-anchor="${esc(anchor)}"><b>${esc(n)}</b></button>`
    : `<b class="meta">${esc(n)}</b>`}</td></tr>`;
}

function nodata(d){
  return `<div class="nodata"><b>no data yet</b><br>
    missing: ${esc((d.missing||[]).join(", ")) || "(unknown)"}<br>
    <span class="meta">${esc(d.why||d.note||"")}</span></div>`;
}
const panel = (title, body, wide, id) =>
  `<section class="panel ${wide?'wide':''}"${id?` id="${esc(id)}"`:''}><h2>${esc(title)}</h2>${body}</section>`;

/* ── EVERY MENTION IS A DOOR ────────────────────────────────────────────────
   The rule for the whole cockpit: if a panel names a thing, clicking the name
   goes to the thing. Before this, OVERVIEW said "improvement proposals 22" and
   that was the end of the sentence — the reader had 22 of something, no way to
   see them, and a tab bar to guess with.

   render() is async and replaces #view wholesale, so the scroll target does not
   exist at the moment the click is handled. goTo() therefore leaves the anchor
   here and wirePanel() — which runs AFTER the new HTML is in the document —
   spends it. */
let pendingAnchor = null;

function goTo(tab, anchor){
  pendingAnchor = anchor || null;
  return switchTo(tab);
}

function takePendingAnchor(){
  if(!pendingAnchor) return;
  const el = document.getElementById(pendingAnchor);
  pendingAnchor = null;
  if(!el) return;
  try{ el.scrollIntoView({behavior:'smooth', block:'start'}); }
  catch(e){ el.scrollIntoView(); }
  /* A brief outline, because a smooth scroll that lands mid-page leaves the
     reader asking which panel it meant. */
  el.classList.add('landed');
  setTimeout(() => el.classList.remove('landed'), 1600);
}

/* ─────────────────────────── renderers ─────────────────────────── */

async function tabOverview(){
  const [c, f, p] = await Promise.all([get('/api/cycles'), get('/api/flow'), get('/api/pending')]);
  const b = c.badges||{};
  const squares = c.checklist.map(s =>
    `<div class="step ${s.state}" title="${esc(s.index+' '+s.step+' — '+s.state+(s.evidence?': '+s.evidence:''))}"></div>`).join('');
  const k = c.counts||{};
  const n = f.computed_now||{};
  const v = n.flow_score!==undefined?n.flow_score:null;
  const bad = v!==null && v < f.red_below;
  return `<div class="grid">
    ${panel('Cycle · '+esc(c.label), `
      <div class="meta">${esc(c.current_cycle||'—')}</div>
      <div class="steps" style="margin:8px 0">${squares}</div>
      <div><span class="pill ${b.survival_latched?'bad':'on'}">survival ${b.survival_latched?'LATCHED':'off'}</span>
      <span class="pill ${b.degraded_steps?'warn':''}">DEGRADED ${b.degraded_steps}</span>
      <span class="pill on">${esc(k.done||0)} on record</span>
      <span class="pill">${esc(k.passed||0)} passed (inferred)</span>
      <span class="pill">${esc(c.covered)}/${c.total_steps} covered</span></div>
      <div class="meta">filled = a checkpoint in cycle_resume.jsonl · outline =
      inferred from the heartbeat's position, not on record</div>`)}
    ${panel('Flow score', `
      <div class="needle ${bad?'bad':'ok'}">${v===null?'—':esc(v)}</div>
      <div class="meta">red zone below ${f.red_below}${f.computed_not_recalled?' · computed now, not recalled':''}</div>`)}
    ${panel('Pending human', `<table>
      ${jumpRow('improvement proposals', p.improvement_proposals.open, 'pending', 'anchor-proposals')}
      ${jumpRow('threshold proposals unsigned', p.threshold_proposals.unsigned, 'pending', 'anchor-thresholds')}
      ${jumpRow('quarantined patches', p.quarantined_patches.count, 'pending', 'anchor-quarantine')}
      </table>
      <div class="meta" style="margin-top:6px">click a count to open it</div>`)}
  </div>`;
}

async function tabCycle(){
  const c = await get('/api/cycles');
  const b = c.badges||{};
  /* Which checklist rows the DEGRADED chip should light. Matched by step name,
     which is the only key the two sides share: the checklist comes from
     cycle_map, the verdicts from step_contract_latest.json. */
  const degNames = new Set((b.degraded_rows||[]).map(r => r.step));
  const rows = c.checklist.map(s =>
    `<tr class="${degOpen && degNames.has(s.step) ? 'deghit' : ''}">
      <td style="width:56px" class="meta">${esc(s.index)}</td>
      <td><span class="pill ${s.state==='done'?'on':s.state==='current'?'warn':''}"
        title="${esc(s.evidence||'')}">${s.state}</span>${s.state==='passed'?'<span class="meta"> inferred</span>':''}</td>
      <td>${esc(s.step)}</td><td class="full">${esc(s.what||'')}</td></tr>`).join('');

  /* The chip's own panel: for each degraded step, WHICH FALLBACK RAN and WHERE
     ITS ARTIFACT IS. Every field here was already in the API payload and was
     being thrown away at render time in favour of the integer 2. */
  const degPanel = !degOpen ? '' : panel('Degraded — what ran instead', `
    <div class="meta" style="margin-bottom:6px">from ${esc(b.degraded_source||'')}</div>
    ${(b.degraded_rows||[]).map(r => `
      <div class="degcard">
        <div><b>${esc(r.step)}</b>
          <span class="meta">${esc(r.seconds)}s${r.calls?` · ${esc(r.calls)} degraded call(s)`:''}</span></div>
        <div class="full">${esc(r.fallback||'')}</div>
        ${r.why?`<div class="meta full">${esc(r.why)}</div>`:''}
        <div class="meta" style="margin-top:3px">artifacts (${esc(r.artifact_count)}):</div>
        ${(r.artifacts||[]).map(a=>`<div class="meta full">${esc(a)}</div>`).join('')}
      </div>`).join('') || '<div class="meta">no degraded step on record</div>'}`,
    true, 'anchor-degraded');
  const sealed = c.last_sealed;
  return `<div class="grid">
    ${panel('Cycle · '+esc(c.label), `
      <div class="meta">${esc(c.current_cycle||'—')} · current step <b>${esc(c.current_step||'—')}</b></div>
      <div>
        <span class="pill ${b.survival_latched?'bad':'on'}">survival ${b.survival_latched?'LATCHED':'off'}</span>
        ${b.degraded_steps
          ? `<button class="pill warn degchip ${degOpen?'on':''}" data-deg="1"
               title="show which steps degraded and what ran instead">DEGRADED ${b.degraded_steps}</button>`
          : `<span class="pill">DEGRADED 0</span>`}
        <span class="pill on">${esc((c.counts||{}).done||0)} on record</span>
        <span class="pill">${esc((c.counts||{}).passed||0)} passed (inferred)</span>
        <span class="pill">${esc(c.covered)}/${c.total_steps} covered</span>
      </div>
      ${sealed?`<table style="margin-top:8px">
        <tr><td>last sealed</td><td>${esc(sealed.sealed_at||'')}</td></tr>
        <tr><td>duration</td><td>${esc(sealed.duration_sec)} s</td></tr>
        <tr><td>ticks recorded</td><td>${esc(sealed.ticks)}</td></tr>
        <tr><td>outcome</td><td>${esc(sealed.outcome)}</td></tr></table>`:''}`, true)}
    ${degPanel}
    ${panel('Steps', `<table>${rows}</table>`, true)}
  </div>`;
}

async function tabWorld(){
  const [g, col] = await Promise.all([get('/api/goal'), get('/api/columns')]);
  const tree = Object.entries(g.tree).map(([sg,axes]) =>
    `<div style="margin-bottom:6px"><div class="meta">${esc(sg)} <span class="pill">${axes.length}</span></div>
     ${axes.map(a=>`<span class="pill">${esc(a.axis)}</span>`).join('')}</div>`).join('');
  const cont = (g.continents||[]).map(c =>

}

async function tabBody(){
  const d = await get('/api/somatic');
  const t = d.toggles||{};
  /* ITEM E — the tag is stated ONCE. reflexivity 0 was repeated on all 42 rows,
     which is noise: a constant printed 42 times carries no information and
     crowds out the values. It renders per-row only where it is NOT 0. */
  let html = `<div class="ctlrow" style="margin-bottom:6px">
     <button class="sw ${t.mic_enabled?'on':''}" data-sw="mic">MIC ${t.mic_enabled?'ON':'OFF'}</button>
     <button class="sw ${t.camera_enabled?'on':''}" data-sw="camera">CAMERA ${t.camera_enabled?'ON':'OFF'}</button>
   </div>
   <div class="meta" style="margin-bottom:8px">all rows: source <b>hardware</b>,
     reflexivity <b>0</b> — raw sensor, no interpretation. A row shows its own tag
     only when it differs.</div>`;
  for(const [g, rows] of Object.entries(d.groups)){
    if(!rows.length) continue;
    html += `<div style="margin-bottom:6px"><div class="meta" style="font-size:10px;letter-spacing:.1em">${esc(g)}</div><table>`;
    for(const r of rows){
      let cell;
      if(r.disabled) cell = `<span class="pill">DISABLED</span>`;
      else if(!r.available) cell = `<span class="meta" title="${esc(r.reason)}">NOT AVAILABLE</span>`;
      else if(typeof r.value === 'number' && r.band){
        /* ITEM D — the colour comes from the API's band, which knows whether
           higher is better. battery 97 is green; battery 15 is red. */
        const cls = r.band==='red'?'bad':r.band==='amber'?'warn':'';
        const pct = (r.unit==='%') ? Math.min(100, Math.max(0, r.value)) : null;
        cell = (pct!==null ? `<div class="bar ${cls}"><i style="width:${pct}%"></i></div> ` : '')
             + `<span class="b-${esc(r.band)}">${esc(r.value)}</span> <span class="meta">${esc(r.unit)}</span>`;
      }
      else cell = `${esc(r.value)} <span class="meta">${esc(r.unit)}</span>`;
      const tag = (r.reflexivity !== 0 || r.source !== 'hardware')
        ? `<td class="meta" style="width:96px">${esc(r.source)} refl ${esc(r.reflexivity)}</td>` : '<td></td>';
      html += `<tr><td style="width:36%">${esc(r.key)}</td><td>${cell}</td>${tag}</tr>`;
    }
    html += `</table></div>`;
  }
  html += `<details><summary>NOT AVAILABLE on this machine (${d.not_available.length})</summary><table>` +
    d.not_available.map(x=>`<tr><td>${esc(x.key)}</td><td class="meta">${esc(x.reason)}</td></tr>`).join('') + `</table></details>`;
  return `<div class="grid">${panel(
    'Somatic map · '+d.available_count+'/'+d.total_count+' · vector '+esc(d.state_vector.version)+
    ' '+d.state_vector.measured+'/'+d.state_vector.dims, html, true)}</div>`;
}

/* Which proposal rows are open, and whether the DEGRADED chip is showing its

const openProposals = new Set();
let degOpen = false;

let exFilter = 'ALL';
let tlCycle = '';        // '' = the last cycle that sealed

/* ITEM 4 — THE WINDOW READS THE VOICE THE SYSTEM ALREADY HAS.
   It used to render memory/expression_stream.jsonl alone: a thin channel of its
   own, while the day's plan, every step stance, every phase debrief, the
   autopsy, the reconsider decision and the report all went to Telegram and to a
   file and to no window. /api/timeline merges all of them, in the order their
   own writers stamped, with the pulse between them. The model's lines are in
   it unchanged — one source among several, not the only one. */
async function tabExpression(){
  const q = tlCycle ? ('?cycle='+encodeURIComponent(tlCycle)) : '';
  const [d, t] = await Promise.all([get('/api/expression?filter='+exFilter),
                                    get('/api/timeline'+q)]);
  const rows = (t.rows||[]).map(r =>
    `<p class="tl r${esc(r.reflexivity)} s-${esc(r.source)}"><span class="pre">${esc((r.ts||'').slice(11,19))} r${esc(r.reflexivity)}</span> <span class="src">${esc(r.source)}</span> ${esc(r.text)}</p>`).join('');
  const counts = Object.entries(t.counts_by_source||{}).sort()
    .map(([k,v])=>`<span class="pill">${esc(k)} ${esc(v)}</span>`).join('');

    `<tr><td><b class="${esc(x.state)}">${esc(x.state)}</b></td><td>${esc(x.source)}</td>
     <td class="meta">${esc(x.path)}</td><td class="meta">${esc(x.rows)} row(s)${x.why?' — '+esc(x.why):''}</td></tr>`).join('');
  const cycles = (t.cycles_available||[]).slice(0,12).map(c =>
    `<option value="${esc(c)}"${c===t.cycle_id?' selected':''}>${esc(c)}</option>`).join('');
  const rej = d.rejected.map(r =>
    `<tr><td class="meta">${esc((r.timestamp||'').slice(11,19))}</td>
     <td>${esc(String(r.raw_output).slice(0,70))}</td><td class="invalid">${esc(r.rejection_reason)}</td></tr>`).join('');
  const warm = d.lexicon || {};
  return `<div class="grid">${panel('Expression window · one timeline, every stream', `
    <div class="ctlrow" style="margin-bottom:6px">
      <select id="tlcycle">${cycles}</select>
      <span class="meta">${esc(t.started||'')} → ${esc(t.finished||'still running')}</span>
      <span class="pill ${warm.warm?'on':'warn'}">${esc(warm.label||'lexicon: unknown')}</span>
    </div>
    <div class="ctlrow" style="margin-bottom:6px">${counts}
      <span class="meta">r0 measured · r1 the system reading the world · r2 the system reading itself</span></div>
    <div class="stream">${rows || '<span class="meta">'+esc(t.empty_because||'nothing on this cycle\'s timeline')+'</span>'}</div>
    <details style="margin-top:6px"><summary>the streams this window reads (${(t.sources||[]).length}) — a silent source is named, not dropped</summary>
      <table class="srcstate">${srcs}</table></details>

      <table>${rej||'<tr><td class="meta">none</td></tr>'}</table></details>`, true)}</div>`;
}

async function tabPending(){
  const [p, pr, fk] = await Promise.all([get('/api/pending'), get('/api/proposals'), get('/api/forks')]);
  const q = p.queues;
  const pf = c => `<button class="pf" data-cmd="${esc(c)}">prefill</button>`;

  /* EXPANDS IN PLACE, BEFORE ANY PREFILL. The row used to show `title`, which
     is the problem truncated to 120 characters — and the solution, the
     measurable goal and the root cause were on disk the whole time. A human is
     being asked to approve these; reading one should not require a terminal. */
  const proposals = q.proposals.rows.map(r => {
    const open = openProposals.has(r.id);
    const d = r.detail || {};
    const field = (k, label) => d[k] === undefined || d[k] === null ? '' :
      `<tr><td class="meta" style="width:130px;vertical-align:top">${esc(label)}</td>
        <td class="full">${esc(String(d[k]))}</td></tr>`;
    const body = !open ? '' : `<tr class="detail"><td colspan="5">
      <table>
        ${field('problem','problem')}
        ${field('solution','solution')}
        ${field('measurable_goal','measurable goal')}
        ${field('root_cause','root cause')}
        ${field('component','component')}
        ${field('priority','priority')}
        ${field('generated_by','generated by')}
        ${field('timestamp','written')}
        <tr><td class="meta">source</td><td class="meta">${esc(r.source||'')}
          ${r.index!==undefined?` · proposals[${esc(r.index)}]`:''}</td></tr>
      </table></td></tr>`;
    return `<tr class="prow ${open?'open':''}" data-prop="${esc(r.id)}">
      <td class="meta">${open?'v':'>'} ${esc(r.id)}</td><td class="full">${esc(r.title)}</td>
      <td class="meta">${esc(r.author)}</td><td class="meta">${esc(r.age_days)}d</td>
      <td>${pf(r.prefill)}</td></tr>` + body;
  }).join('');
  const thresholds = q.thresholds.rows.map(r =>
    `<tr><td>${esc(r.axis)}</td><td><b>${esc(r.suggested)}</b></td>
      <td class="meta">target ${esc(r.target)}</td><td class="meta">${esc(r.basis)}</td>
      <td>${pf(r.prefill)}</td></tr>`).join('');
  const quarantine = q.quarantine.rows.map(r =>
    `<tr><td>${esc(r.file)}</td>
      <td><span class="pill ${r.verdict==='REVIEW'?'warn':''}">${esc(r.verdict)}</span></td>
      <td class="meta">${esc(r.bytes)} B</td><td>${pf(r.prefill)}</td></tr>`).join('');
  const telegram = q.telegram.rows.map(r =>
    `<tr><td class="meta">${esc(r.id)}</td><td>${esc(r.label)}</td>
      <td class="meta">${esc(r.axis||'')}</td><td class="meta">reply: ${esc(r.reply)}</td>
      <td>${pf(r.prefill)}</td></tr>`).join('');

  const authors = Object.entries(pr.groups).map(([a,g]) =>
    `<tr><td>${esc(a)}</td><td><b>${g.count}</b></td></tr>`).join('');
  let forks;
  if(fk.no_data) forks = nodata(fk);
  else if(fk.offline) forks = `<div class="nodata"><b>offline</b><br><span class="meta">${esc(fk.error)}</span></div>`;
  else forks = `<div class="meta">${fk.count} fork(s)</div><table>` +
    (fk.forks||[]).map(f=>`<tr><td><a href="${esc(f.html_url)}" target="_blank">${esc(f.full_name)}</a></td></tr>`).join('')+`</table>`;

  return `<div class="grid">
    ${panel('Proposals waiting — '+q.proposals.count, `
      <div class="meta" style="margin-bottom:6px">${esc(p.prefill_note)} · click a row to read it in full</div>
      <table><tr><th>id</th><th>problem</th><th>author</th><th>age</th><th></th></tr>${proposals}</table>`,
      true, 'anchor-proposals')}
    ${panel('Thresholds unsigned — '+q.thresholds.count,
      `<table><tr><th>axis</th><th>suggested</th><th></th><th>basis</th><th></th></tr>${thresholds}</table>`,
      false, 'anchor-thresholds')}
    ${panel('Quarantine — '+q.quarantine.count,
      `<table><tr><th>file</th><th>triage</th><th></th><th></th></tr>${quarantine}</table>`,
      false, 'anchor-quarantine')}
    ${panel('Telegram approvals — '+q.telegram.count,
      `<table><tr><th>id</th><th>what</th><th>axis</th><th></th><th></th></tr>${telegram}</table>`)}
    ${panel('Proposals by author', `<div class="meta">grouped on <code>${esc(pr.field_used)}</code> · ${pr.total} total</div>
      <table>${authors}</table>`)}
    ${panel('Forks', forks + `<button onclick="drawForksRefresh()">refresh (one manual network call)</button>`)}
  </div>`;
}

const RENDER = {overview:tabOverview, cycle:tabCycle, world:tabWorld, body:tabBody,
                expression:tabExpression, pending:tabPending, glass:tabGlass,
                terminal:tabTerminal};


/* ── GLASS — a window, not a sense ──────────────────────────────────────────
   Three panels, each rendering something that already flows. It takes NO
   reading of its own: /api/glass reads the cycle log, the firewall log and the
   counters /api/somatic already fetched. The banner says so, because a raw
   render that is not labelled gets mistaken for the pulse stream or for
   expression, and those are mediated and this is not.

   It is a TOP-LEVEL TAB, one click from anywhere, not the bottom of a scroll. */
/* ── the raw stream: speed is a reading choice, not a setting ─────────────
   Slow enough to read a line, or fast enough that the text stops being text
   and becomes texture - a visual signal of how much is happening. Both are
   legitimate readings, so both are offered and neither is the default-correct
   one. */
let streamHz = 1;
let streamTimer = null;

function stopStream(){ if(streamTimer){ clearInterval(streamTimer); streamTimer = null; } }

function startStream(){
  stopStream();
  if(active !== 'glass') return;
  streamTimer = setInterval(drawStream, Math.max(80, 1000 / streamHz));
}

async function drawStream(){
  const el = $('#streamBody');
  if(!el){ stopStream(); return; }
  try{
    const d = await get('/api/stream');
    if(d.error){ el.innerHTML = `<div class="invalid">${esc(d.error)}</div>`; return; }
    const sil = d.silence || {};
    const head = `<div class="muted">${esc(d.label||'')} — ${d.n} line(s) in a
      ${d.buffer}-line window, ${d.seen} seen, ${d.dropped} dropped</div>`;
    /* THE SILENCE EXPLAINS ITSELF. An empty panel must never be confusable
       with a broken one. */
    const quiet = (!d.lines || !d.lines.length)
      ? `<div class="quiet">${esc(sil.text||'')}<div class="muted">${esc(sil.detail||'')}</div></div>`
      : '';
    const body = (d.lines||[]).slice().reverse()
      .map(l => `<div class="sline ch-${esc(l.channel)}">${esc(l.text)}</div>`).join('');
    el.innerHTML = head + quiet + `<pre class="raw">${body}</pre>`;
  }catch(e){
    el.innerHTML = `<div class="invalid">${esc(e.message||e)}</div>`;
  }
}

function streamControls(){
  const speeds = [[0.5,'0.5/s'],[1,'1/s'],[4,'4/s'],[12,'12/s — texture']];
  return speeds.map(([hz,label]) =>
    `<button class="spd ${hz===streamHz?'on':''}" data-hz="${hz}">${label}</button>`
  ).join('');
}

/* ── the reaction: shown verbatim, or not shown at all ────────────────────
   Never post-edited, never summarised, never replaced by a template when it
   is poor. A weak answer is displayed as a weak answer - that is data about
   the system, and a template would hide exactly the thing worth seeing.

   The language gate decides the EXEMPLAR POOL. It has no vote on display, and
   an answer that failed it is shown WITH its verdict beside it. */
async function drawReaction(){
  const el = $('#reactionBody');
  if(!el) return;
  try{
    const d = await get('/api/reaction');
    if(d.error){ el.innerHTML = `<div class="invalid">${esc(d.error)}</div>`; return; }
    const head = `<div class="muted">${esc(d.label||'')} —
      ${d.enabled ? 'ENABLED' : 'DISABLED'}: ${esc(d.why_off||'')}</div>`;
    if(!d.rows || !d.rows.length){
      el.innerHTML = head + `<div class="quiet">NO REACTIONS RECORDED
        <div class="muted">the flag is off; nothing has asked</div></div>`;
      return;
    }
    const body = d.rows.slice().reverse().map(r => {
      const lang = r.language || {};
      const badge = lang.exemplar_ok
        ? `<span class="ok">exemplar: yes</span>`
        : `<span class="bad">exemplar: no (${esc(lang.reason||'')})</span>`;
      const lines = (r.lines||[]).map(l => esc(l)).join('\n');
      return `<div class="rx">
        <div class="muted">${esc(r.ts||'')} · ${esc(r.model||'')} ·
          ${r.n_lines} line(s) · ${badge}</div>
        <pre class="rxlines">${lines}</pre>
        <div class="rxanswer">${esc(r.answer || '(the model returned nothing)')}</div>
      </div>`;
    }).join('');
    el.innerHTML = head + body;
  }catch(e){ el.innerHTML = `<div class="invalid">${esc(e.message||e)}</div>`; }
}

/* ── blocked connections, as they arrive ─────────────────────────────────
   A spark per NEW row. Named for what it is: most of this is internet
   background noise and some is Emil's own software being denied a port. If a
   stable pattern appears we name it then, with numbers. */
let blockedOffset = null;
let blockedTimer = null;
const blockedSparks = [];

function stopBlocked(){ if(blockedTimer){ clearInterval(blockedTimer); blockedTimer = null; } }

async function drawBlocked(){
  const el = $('#blockedBody');
  if(!el){ stopBlocked(); return; }
  try{
    const q = blockedOffset === null ? '' : `?since=${blockedOffset}`;
    const d = await get('/api/blocked' + q);
    if(d.error){ el.innerHTML = `<div class="invalid">${esc(d.error)}</div>`; return; }
    if(blockedOffset !== null && d.new){
      for(const r of d.rows.slice(-d.new)) blockedSparks.unshift(r);
      blockedSparks.length = Math.min(blockedSparks.length, 60);
    } else if(blockedOffset === null){
      blockedSparks.length = 0;
      for(const r of (d.rows||[]).slice().reverse()) blockedSparks.push(r);
    }
    blockedOffset = d.offset;

    const sparks = blockedSparks.map((r,i) =>
      `<div class="spark ${i===0?'fresh':''}">${esc(r.time)} ${esc(r.action)}
         ${esc(r.protocol)} ${esc(r.src)} &rarr; ${esc(r.dst)}:${esc(r.dst_port)}
         <span class="muted">pid ${esc(r.pid)} ${esc(r.process||'')}</span></div>`
    ).join('');

    const c = d.counters || {};
    const row = o => Object.entries(o||{}).map(([k,v]) =>
      `${esc(k)} ${v}`).join(' · ') || '-';
    /* COUNTERS UNDER THE SPARKS. The arrivals are the panel. */
    const counters = `<div class="counters">
        <div>${row(c.by_action)} · ${row(c.by_protocol)}</div>
        <div class="muted">by process: ${row(c.by_process)}</div>
        <div class="muted">by port: ${row(c.by_port)}</div></div>`;

    el.innerHTML = `<div class="muted">${d.total} row(s) in the log.
        ${esc(d.note||'')}</div><div class="sparks">${sparks}</div>${counters}`;
  }catch(e){ el.innerHTML = `<div class="invalid">${esc(e.message||e)}</div>`; }
}

/* ── what is actually wearing ─────────────────────────────────────────── */
async function drawEntropy(){
  const el = $('#entropyBody');
  if(!el) return;
  try{
    const d = await get('/api/entropy');
    if(d.error){ el.innerHTML = `<div class="invalid">${esc(d.error)}</div>`; return; }
    const g = Object.entries(d.growth||{}).filter(([,v]) => v.exists)
      .map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v.bytes.toLocaleString()} B</td>
        <td>${v.rows.toLocaleString()} rows</td>
        <td>${Math.round(v.bytes_per_day).toLocaleString()} B/day</td></tr>`).join('');
    const dur = (d.duration||{});
    const cyc = (dur.cycles||[]).slice(-6).map(c =>
      `<tr><td>${c.minutes} min</td><td>${c.steps===null?'—':c.steps} steps</td>
        <td>${c.min_per_step!==undefined ? c.min_per_step+' min/step ('+c.vs_normal+'x)' : '—'}</td></tr>`
      ).join('');
    const amb = Object.entries(d.ambient||{}).map(([k,v]) =>
      `<div class="muted">${esc(k)}: ${v.readable?'readable':'not readable'} —
        ${esc(v.why)}</div>`).join('');
    el.innerHTML = `
      <table class="tbl"><tbody>${g}</tbody></table>
      <div class="muted" style="margin-top:6px">cycle duration against step
        count (normal ${dur.normal_min_per_step} min/step)</div>
      <table class="tbl"><tbody>${cyc}</tbody></table>
      ${dur.why ? `<div class="muted">${esc(dur.why)}</div>` : ''}
      <div style="margin-top:6px">INSUFFICIENT marks: ${(d.insufficient||{}).count}
        <span class="muted">${esc((d.insufficient||{}).why||'')}</span></div>
      <div>idle_seconds: ${(d.idle||{}).idle_seconds}
        <span class="muted">${esc((d.idle||{}).note||'')}</span></div>
      <div class="muted" style="margin-top:6px">fragmentation:
        ${esc((d.fragmentation||{}).why||'')}</div>
      <div style="margin-top:6px">ambient sensors — declared, not built:</div>${amb}`;
  }catch(e){ el.innerHTML = `<div class="invalid">${esc(e.message||e)}</div>`; }
}

async function tabGlass(){
  const d = await get('/api/glass');
  if(d.error) return `<div class="grid">${panel('GLASS',
    `<div class="invalid">${esc(d.error)}</div>`)}</div>`;

  const so = d.stdout || {};
  const stdoutBody = (so.lines && so.lines.length)
    ? `<div class="muted">${esc(so.path||'')} — ${so.total_lines} line(s)${so.truncated?', showing the last '+so.lines.length:''}</div>
       <pre class="raw">${esc(so.lines.join('\n'))}</pre>`
    : `<div class="muted">${esc(so.why||'nothing yet')}</div>`;

  const bl = d.blocked || {};
  const rows = (bl.rows||[]).slice().reverse().map(r =>
    `<tr><td>${esc(r.time)}</td><td>${esc(r.action)}</td><td>${esc(r.protocol)}</td>
         <td>${esc(r.src)}</td><td>${esc(r.dst)}:${esc(r.dst_port)}</td>
         <td>${esc(r.direction)}</td><td>${esc(r.pid)}</td>
         <td>${esc(r.process||'')}</td></tr>`).join('');
  const blockedBody = bl.available
    ? `<div class="muted">${bl.total} row(s) in the log, showing ${(bl.rows||[]).length}. ${esc(bl.note||'')}</div>
       <table class="tbl"><thead><tr><th>time</th><th>action</th><th>proto</th>
         <th>from</th><th>to</th><th>dir</th><th>pid</th><th>process</th></tr></thead>
         <tbody>${rows}</tbody></table>`
    : `<div class="muted">${esc(bl.why||'firewall log unreadable')}</div>`;

  const tr = d.traffic || {};
  const tvals = Object.entries(tr.values||{}).map(([k,v]) =>
    `<tr><td>${esc(k)}</td><td>${v===null?'—':esc(String(v))}</td>
         <td class="muted">${(tr.series&&tr.series[k])?tr.series[k].length+' samples':''}</td></tr>`).join('');
  const trafficBody = tvals
    ? `<div class="muted">from ${esc(tr.source||'?')} — no probe was taken to draw this</div>
       <table class="tbl"><tbody>${tvals}</tbody></table>`
    : `<div class="muted">${esc(tr.why||'no reading yet')}</div>`;

  const streamPanel = `<div class="muted">source:hardware, mediation:code —
      the live text of the event bus. Zero new sensor probes: it subscribes.</div>
    <div class="spdrow">${streamControls()}</div>
    <div id="streamBody"><div class="muted">connecting...</div></div>`;

  return `<div class="grid">
    ${panel('GLASS', `<div class="muted">${esc(d.label)}</div>`)}
    ${panel('raw receptor stream', streamPanel)}
    ${panel('the reaction', `<div id="reactionBody"><div class="muted">loading...</div></div>`)}
    ${panel('raw stdout', stdoutBody)}
    ${panel('blocked connections', `<div id="blockedBody"><div class="muted">loading...</div></div>`)}
    ${panel('traffic counters', trafficBody)}
    ${panel('what is wearing', `<div id="entropyBody"><div class="muted">loading...</div></div>`)}
  </div>`;
}

/* WHERE THE READER WAS. tick() re-renders every 15 seconds and render()
   replaces #view wholesale, so the page jumped to the top twice a minute — on a
   31-row step list that meant the row being read walked off the screen while it
   was being read. The scroll offset is taken before the swap and put back after
   it, on the SAME tab only: switching tab is a deliberate move to a new document
   and should land at the top.

   Restored synchronously, before the frame is painted, so there is no visible
   jump-and-return. An anchor from goTo() wins — the reader asked for that. */
let lastRenderedTab = null;

async function render(){
  const view = $('#view');
  const sameTab = (lastRenderedTab === active);
  const keepY = sameTab ? (window.scrollY || 0) : 0;
  lastRenderedTab = active;

  if(active === 'terminal'){
    view.innerHTML = tabTerminal();
    wireTerminal();
    return;
  }
  try { view.innerHTML = await RENDER[active](); }
  catch(e){ view.innerHTML = `<div class="grid">${panel('error',
    `<div class="invalid">${esc(e.message||e)}</div>`)}</div>`; }
  if(keepY && !pendingAnchor){
    try{ window.scrollTo(0, keepY); }catch(e){}
  }
  wirePanel();
}

function wirePanel(){
  document.querySelectorAll('.spd').forEach(b =>
    b.onclick = () => { streamHz = parseFloat(b.dataset.hz); render(); });
  if(active === 'glass'){
    drawStream(); drawReaction(); startStream();
    blockedOffset = null; drawBlocked();
    stopBlocked(); blockedTimer = setInterval(drawBlocked, 3000);
    drawEntropy();
  }
  else { stopStream(); stopBlocked(); }
  document.querySelectorAll('.fbtn').forEach(b =>
    b.onclick = () => { exFilter = b.dataset.f; render(); });
  const tlc = $('#tlcycle');
  if(tlc) tlc.onchange = () => { tlCycle = tlc.value; render(); };
  document.querySelectorAll('[data-sw]').forEach(b =>
    b.onclick = () => toggleDevice(b.dataset.sw));
  document.querySelectorAll('.pf').forEach(b =>
    b.onclick = () => prefill(b.dataset.cmd));

  /* every mention that is a door */
  document.querySelectorAll('.jump').forEach(b =>
    b.onclick = () => goTo(b.dataset.tab, b.dataset.anchor));
  document.querySelectorAll('.degchip').forEach(b =>
    b.onclick = () => { degOpen = !degOpen;
                        pendingAnchor = degOpen ? 'anchor-degraded' : null;
                        return render(); });
  document.querySelectorAll('.prow').forEach(row =>
    row.onclick = (e) => {
      /* the prefill button inside the row keeps its own job */
      if(e.target && e.target.closest && e.target.closest('.pf')) return;
      const id = row.dataset.prop;
      if(openProposals.has(id)) openProposals.delete(id); else openProposals.add(id);
      return render();
    });

  takePendingAnchor();
}

/* ── forks refresh needs to survive a re-render ── */
async function drawForksRefresh(){ await get('/api/forks?refresh=1'); render(); }

/* ─────────────────────────── control bar ─────────────────────────── */

async function refreshUnread(){
  try{
    const d = await get('/api/expression');
    const el = $('#unread');
    el.textContent = d.unread + ' unread';
    el.className = 'unread' + (d.unread ? '' : ' zero');
    el.disabled = !d.unread;
  }catch(e){}
}

/* ITEM 6b — the pull that marks lines seen. /api/expression/seen is append-only
   by design: "seen" is a fact about a moment and a mark that can be taken back
   makes the count a number the reader can talk themselves into. So this sends
   the timestamps of the expression lines CURRENTLY IN THE STREAM and nothing
   else — never "mark everything", which would silently swallow lines written
   between the last poll and the click. */
async function markSeen(){
  const el = $('#unread');
  try{
    const d = await get('/api/expression');
    const ts = (d.lines||[]).filter(l => l.depth === 'expression')
                            .map(l => l.ts).filter(Boolean);
    if(!ts.length){ return; }
    const r = await fetch('/api/expression/seen', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ts})});
    const out = await r.json();
    el.textContent = out.unread + ' unread';
    el.className = 'unread' + (out.unread ? '' : ' zero');
    el.disabled = !out.unread;
  }catch(e){ el.textContent = 'seen failed'; }
}

$('#asksend').onclick = async () => {
  const t = $('#askbox').value.trim(); if(!t) return;
  const deep = /^DEEP:/i.test(t);
  await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text: deep ? t.slice(5).trim() : t, tag: deep ? 'DEEP' : null})});
  $('#askbox').value = '';
  refreshUnread();
};
$('#askbox').addEventListener('keydown', e => { if(e.key === 'Enter') $('#asksend').click(); });

/* PREFILL: switch to TERMINAL and TYPE the command. Never sends a newline. */
function prefill(cmd){
  switchTo('terminal');
  setTimeout(() => {
    if(!isConnected(curTab)){
      /* NOTHING IS WRITTEN TO THE BUFFER. The old code wrote a notice into the
         xterm, which is how a cockpit message ended up on top of live output. */
      setTermStatus(curTab, 'not connected — press connect, then click the button again');
      return;
    }
    /* TO THE SHELL'S STDIN, exactly as if typed. The shell echoes it at its own
       prompt and the cursor lands at the end of the line. NO newline: the human
       presses Enter. */
    SESSIONS[curTab].ws.send(JSON.stringify({type:'in', data: cmd}));
    setTermStatus(curTab, 'typed into the shell — press Enter to run it');
  }, 120);
}
document.querySelectorAll('.cmd').forEach(b => b.onclick = () => prefill(b.dataset.cmd));

async function toggleDevice(which){
  const state = await get('/api/toggle');
  const key = which === 'mic' ? 'mic_enabled' : 'camera_enabled';
  const turningOn = !state.toggles[key];
  const what = which === 'mic' ? 'the microphone' : 'the camera';
  const msg = turningOn
    ? `Switch ${what} ON?\n\nOne sample is taken per probe, at most once every 10 seconds, reduced to a scalar. No audio or image is ever written to disk. Refused entirely while a cycle is running.`
    : `Switch ${what} OFF?`;
  if(!confirm(msg)) return;
  await fetch('/api/toggle', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({[key]: turningOn})});
  refreshSwitches();
  if(active === 'body') render();
}
$('#unread').onclick = markSeen;
$('#swmic').onclick = () => toggleDevice('mic');
$('#swcam').onclick = () => toggleDevice('camera');

async function refreshSwitches(){
  try{
    const d = await get('/api/toggle');
    $('#swmic').textContent = 'MIC ' + (d.toggles.mic_enabled ? 'ON' : 'OFF');
    $('#swmic').className = 'sw' + (d.toggles.mic_enabled ? ' on' : '');
    $('#swcam').textContent = 'CAM ' + (d.toggles.camera_enabled ? 'ON' : 'OFF');
    $('#swcam').className = 'sw' + (d.toggles.camera_enabled ? ' on' : '');
  }catch(e){}
}

/* ─────────────────────────── terminal ───────────────────────────
   THREE TABS ARE THREE SESSIONS. Each has its own Terminal instance, its own
   scrollback and its own WebSocket, spawned on first connect and kept alive when
   you switch away. Switching tabs shows that session's buffer; it never closes
   anything. Closing is explicit.

   THE XTERM BUFFER CARRIES PTY BYTES AND NOTHING ELSE. Every cockpit message
   goes to #termstatus, a line ABOVE the terminal and outside the xterm element.
   Writing status into the buffer is what produced "[STEP] bootot connected —
   paste the token": two writers interleaving inside one stream, one of them
   racing a live cycle's stdout. A status line cannot interleave with anything.  */

const SESSIONS = {};          // tab -> {term, fit, ws, mounted, status}

function sessionOf(tab){
  if(!SESSIONS[tab]){
    SESSIONS[tab] = {term:null, fit:null, ws:null, mounted:false,
                     status:'not started — click connect'};
  }
  return SESSIONS[tab];
}

/* THE ONLY PLACE COCKPIT TEXT IS ALLOWED TO GO. Never term.write(). */
function setTermStatus(tab, msg){
  sessionOf(tab).status = msg;
  if(active === 'terminal' && curTab === tab){
    const el = $('#termstatus');
    if(el) el.textContent = msg;
  }
}

function isConnected(tab){
  const s = SESSIONS[tab];
  return !!(s && s.ws && s.ws.readyState === 1);
}

function ensureSession(tab){
  const s = sessionOf(tab);
  if(!s.term){
    s.term = new Terminal({fontSize:12, theme:{background:'#080a0d'}, convertEol:true});
    s.fit = new FitAddon.FitAddon();
    s.term.loadAddon(s.fit);
    s.term.onData(d => {
      const cur = SESSIONS[tab];
      if(cur && cur.ws && cur.ws.readyState === 1)
        cur.ws.send(JSON.stringify({type:'in', data:d}));
    });
  }
  return s;
}

function mountSession(tab){
  const s = ensureSession(tab);
  const host = document.getElementById('pane-' + tab);
  if(host && !s.mounted){ s.term.open(host); s.mounted = true; }
  try{ s.fit.fit(); }catch(e){}
}

function showTerminalTab(tab){
  curTab = tab;
  TERM_TABS.forEach(t => {
    const pane = document.getElementById('pane-' + t);
    if(pane) pane.style.display = (t === tab) ? 'block' : 'none';
  });
  document.querySelectorAll('.tabbtn').forEach(b =>
    b.classList.toggle('active', b.dataset.tt === tab));
  mountSession(tab);
  const el = $('#termstatus');
  if(el) el.textContent = sessionOf(tab).status;
  const close = $('#closebtn');
  if(close) close.disabled = !isConnected(tab);
}

function connectTab(tab){
  const s = ensureSession(tab);
  if(isConnected(tab)){ setTermStatus(tab, 'already connected'); return; }
  const token = ($('#tok') ? $('#tok').value.trim() : '');
  if(!token){
    setTermStatus(tab, 'no session token — the server injects it; if this field is '
                     + 'empty the bridge did not start (see the launch console)');
    return;
  }
  setTermStatus(tab, 'connecting…');
  const ws = new WebSocket('ws://127.0.0.1:5056');
  s.ws = ws;
  ws.onopen = () => {
    ws.send(JSON.stringify({token, tab, cols:s.term.cols, rows:s.term.rows}));
    setTermStatus(tab, 'connected · cwd is the repo root');
    const c = $('#closebtn'); if(c && curTab === tab) c.disabled = false;
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    /* PTY BYTES ONLY. An error from the bridge is cockpit text and goes to the
       status line, not into the buffer. */
    if(m.type === 'out') s.term.write(m.data);
    else if(m.type === 'error') setTermStatus(tab, 'bridge error: ' + m.error);
  };
  ws.onclose = e => {
    s.ws = null;
    setTermStatus(tab, 'closed' + (e.reason ? (': ' + e.reason) : '')
                       + ' — click connect to start a new session');
    const c = $('#closebtn'); if(c && curTab === tab) c.disabled = true;
  };
  ws.onerror = () => setTermStatus(tab, 'could not reach the bridge on 127.0.0.1:5056');
}

function closeTab(tab){
  const s = SESSIONS[tab];
  if(!s || !s.ws){ setTermStatus(tab, 'nothing to close'); return; }
  try{ s.ws.close(); }catch(e){}
  s.ws = null;
  setTermStatus(tab, 'closed by you — the scrollback is kept');
}

function wireTerminal(){
  TERM_TABS.forEach(t => ensureSession(t));
  document.querySelectorAll('.tabbtn').forEach(b =>
    b.onclick = () => showTerminalTab(b.dataset.tt));
  $('#connect').onclick = () => connectTab(curTab);
  $('#closebtn').onclick = () => closeTab(curTab);
  showTerminalTab(curTab);
}

window.addEventListener('resize', () => {
  if(active === 'terminal'){ const s = SESSIONS[curTab];
    if(s && s.fit){ try{ s.fit.fit(); }catch(e){} } }
});

/* ─────────────────────────── boot ─────────────────────────── */
async function tick(){
  $('#clock').textContent = new Date().toISOString().slice(0,19)+'Z';
  try{
    const p = await get('/api/panels');
    const live = p.panels.filter(x => x.live);
    $('#panelstat').textContent = live.length+'/'+p.panels.length+' panels have data';
    const map = {overview:['cycles','flow','pending'], cycle:['cycles'],
                 world:['goal','columns'], body:['somatic'],
                 expression:['expression'], pending:['pending','proposals','forks'],
                 terminal:['terminal']};
    hasData = {};
    for(const [t, keys] of Object.entries(map))
      hasData[t] = keys.some(k => (p.panels.find(x => x.panel===k)||{}).live);
    drawTabs();
  }catch(e){}
  refreshUnread(); refreshSwitches();
  if(active !== 'terminal') render();
}
drawTabs(); render(); tick();
setInterval(tick, 15000);
</script>
