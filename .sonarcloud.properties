# .sonarcloud.properties — configuration for SonarCloud AUTOMATIC ANALYSIS.
#
# WHY THIS FILENAME AND NOT sonar-project.properties
# ---------------------------------------------------
# .github/workflows/ci.yml has no Sonar step and runs no scanner, so this project is
# analysed by SonarCloud's Automatic Analysis. Under automatic analysis a
# sonar-project.properties file is IGNORED — it is read only by the CLI/CI scanner,
# which nothing here invokes. The file automatic analysis reads is this one.
# Writing the other filename would have looked like configuration and changed nothing.
#
# WILDCARDS ARE NOT ALLOWED HERE. Automatic analysis accepts plain paths only, so
# every entry below is a literal directory name — no **, no *.json. It also supports
# only these keys: sonar.sources, sonar.exclusions, sonar.inclusions, sonar.tests,
# sonar.test.exclusions, sonar.test.inclusions, sonar.sourceEncoding,
# sonar.cpd.exclusions, sonar.python.version.
#
# COVERAGE IS NOT CONFIGURED, AND CANNOT BE.
# Automatic analysis does not support test coverage at all. There is no property that
# would make it appear, so none is set here. A coverage figure on this project would
# have to come from a real scanner step in CI, and that does not exist yet. Read the
# absence of a coverage number as "not measured", never as "nothing covered".
#
# sonar.exclusions WITH BARE DIRECTORY NAMES HAD NO MEASURABLE EFFECT
# --------------------------------------------------------------------
# MEASURED, on master, after the merge that introduced sonar.exclusions:
#
#     lines of code   205k  ->  208k       (it went UP; the delta is code added
#                                           in the same window, not a reduction)
#     Code view       config, cortex_memory, daily and data all still counted
#
# So the sixteen directory names in sonar.exclusions removed nothing at all.
#
# HYPOTHESIS for why — stated as a hypothesis, because it is not measured:
# sonar.exclusions expects FILE patterns, and a bare `raw_data` therefore matches only
# a file literally named `raw_data` — which does not exist, so the pattern matches
# nothing. The usual spelling would be `raw_data/**`, and .sonarcloud.properties does
# not allow wildcards. If that is right, directory exclusion is not expressible through
# this key at all, and no amount of reordering the list would have helped.
#
# THE FIX IS A DIFFERENT MECHANISM, NOT A BETTER LIST.
# sonar.sources is a supported key here and takes plain paths, so it is used below as an
# explicit INCLUDE list: the eleven top-level directories that contain at least one
# tracked .py file, plus the 56 tracked .py files at the repository root. 67 entries,
# covering all 320 tracked .py files — verified, none missed. Everything else is
# excluded by OMISSION, which needs no pattern syntax and cannot silently match nothing.
# The 22 tracked top-level directories with no .py in them — config, cortex_memory,
# daily, data, snapshots, news, knowledge, output, raw_data and the rest — simply are
# not named.
#
# CONSEQUENCE OF THE ABOVE FOR THE PREVIOUS COMMIT'S CLAIM (09c1780):
# that commit recorded "test/ is excluded outright and receives no static analysis,
# 619 tests are now outside the lens". If the hypothesis here is correct, that was
# never true — the exclusion was inert, and test/ has been analysed all along. `test`
# is one of the eleven directories with tracked .py files and is therefore named in
# sonar.sources below, so from now on it is analysed deliberately rather than by
# accident. It also remains listed in sonar.exclusions; if that key ever starts
# working, the two will disagree and test/ will drop out. Worth watching on the next
# analysis rather than assuming.
#
# WHAT IS EXCLUDED, AND THE RULE THAT PICKED IT
# ----------------------------------------------
# sonar.exclusions is KEPT below, unchanged. It is retained because it is harmless if
# it matches nothing, and there is no evidence it does harm; it is not relied upon.
# Every directory in it holds ZERO tracked .py files (verified 17 Aug 2026 with
# `git ls-files -- <dir> | grep '\.py$'`), with the single exception of `test`,
# discussed above. They are runtime state and data the cycle writes — snapshots,
# ledgers, cached JSON, generated reports — not source anyone maintains.
#
# WHAT IS DELIBERATELY *NOT* EXCLUDED
# ------------------------------------
# memory/ is NOT on this list. The name suggests data, and most of what is on disk
# there is data, but it also holds 19 tracked modules — heartbeat.py, trend_tracker.py,
# context_injector.py, prediction_tracker.py, existence_ledger.py and others — that
# the cycle imports on every run, and that Sonar has raised real findings against.
# Excluding memory/ would raise the score without changing the code, which is hiding
# the number rather than earning it. Same reasoning keeps alignment/ (1 module) and
# safety/ (ast_gate.py, protected_paths.py, quarantine.py — the code that decides what
# self-modification may write) fully in scope.
#
# Before adding a directory here, run the count. One .py file disqualifies it.
#
# WHY test/ IS ON THE EXCLUSION LIST DESPITE BEING FULL OF .py FILES
# -------------------------------------------------------------------
# It is the one entry that does NOT follow the zero-.py rule above. sonar.sources
# defaults to '.', which already includes test/, so declaring sonar.tests=test put the
# same files in both roles. Automatic analysis did not degrade and did not warn — it
# REJECTED THE WHOLE RUN. Two attempts, both rejected, both verified on PR #6:
#
#   attempt 1  sonar.tests=test, test NOT in exclusions  -> "Source and test paths overlap"
#              analysis_id 20b0c68a-9088-47f2-8377-a964bae567ea
#              file       test/test_canon_boundaries.py
#
#   attempt 2  sonar.tests=test, test IN exclusions      -> same error, new analysis
#              analysis_id e0efdf77-c98b-4e3e-9429-041294b2dadb
#              file       test/test_need_class.py
#
# Attempt 2 is the informative one: under automatic analysis, sonar.exclusions does NOT
# remove a directory from sonar.sources for the purposes of the overlap check. Excluding
# test/ and declaring it as tests are not two compatible halves of one configuration —
# the second is simply unavailable here. So sonar.tests is gone, not merely reordered.
#
# THE CONSEQUENCE — SUPERSEDED, AND THE CORRECTION KEPT VISIBLE
# --------------------------------------------------------------
# This section previously read: "test/ is now excluded outright and is NOT analysed by
# SonarCloud at all. 619 passing tests receive no static analysis." That was written as
# a measured consequence. It was an INFERENCE from sonar.exclusions working — and the
# 205k -> 208k measurement recorded at the top of this file says it does not.
#
# So the gap that paragraph mourned probably never existed: test/ was most likely being
# analysed the whole time, as ordinary source. It is now named in sonar.sources, which
# makes that deliberate instead of accidental.
#
# What remains true, and is the smaller real cost: test files are analysed with SOURCE
# rules rather than test rules, because sonar.tests cannot be used here (see the two
# rejected analyses above). Expect assert-heavy and duplication findings in test/ that a
# proper test-role configuration would not raise. That is a nuisance, not a blind spot —
# a different thing from what this section used to claim.
#
# The way to get the two-role split is CI-based analysis, where sonar.sources and
# sonar.tests both work. The paragraph is left here, corrected rather than deleted,
# because the mistake in it is instructive: a consequence derived from an unverified
# assumption reads exactly like a measured one once it is written down.

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# The 11 code directories, then the 56 tracked .py files at the repo root.
# Everything not named here is excluded by omission. Regenerate with:
#   git ls-files '*.py' | awk -F/ 'NF>1{print $1}' | sort -u   (the directories)
#   git ls-files '*.py' | grep -v /                           (the root files)
sonar.sources=agents,alignment,core,cortex,data_providers,docs,experiments,memory,safety,scripts,test,_clean_proposals.py,_diag.py,_divergence_pilot.py,_refresh_three_axes.py,check_axes.py,citation_verifier.py,civilization_state_review_agent_qwen.py,conftest.py,cortex_approval_server.py,cortex_dashboard_generator.py,cortex_planning_agent.py,cortex_proposal_executor.py,cortex_scan.py,cortex_scanner.py,cortex_scoring_engine.py,data_source_audit.py,energy_review_patch.py,evaluator.py,execute_patches.py,fast_cycle_runner.py,github_publisher.py,goal_score_calculator.py,historical_fetch.py,hypercortex_runner.py,hyperon_bridge.py,hypothesis_generator.py,initiative_tracker.py,live_divergence_pilot.py,manual_pre_llm_backup.py,media_intel_scheduler.py,media_intel_worker.py,media_transcript_injector.py,merkle_memory.py,merkle_to_training.py,patch_guardian.py,podcast_source.py,predictor.py,qwen_civilization_daily_review_agent.py,qwen_cortex_agent.py,qwen_planetary_repl.py,qwen_repl.py,reasoning_extractor.py,run_daily.py,search_logic.py,self_observer.py,sentinels.py,supervisor.py,system_hypergraph.py,test_llm.py,web_intelligence_agent.py,wellbeing_batch.py,wellbeing_country.py,wellbeing_globe.py,wellbeing_profile.py,youtube_intel.py,youtube_worker.py
