# .sonarcloud.properties — configuration for SonarCloud AUTOMATIC ANALYSIS.
#
# WHY THIS FILENAME AND NOT sonar-project.properties
# ---------------------------------------------------
# .github/workflows/ci.yml has no Sonar step and runs no scanner, so this project is
# analysed by SonarCloud's Automatic Analysis. Under automatic analysis a
# sonar-project.properties file is IGNORED — it is read only by the CLI/CI scanner,
# which nothing here invokes. The file automatic analysis reads is this one.
# Writing the other filename would have looked like configuration and changed nothing.
#
# WILDCARDS ARE NOT ALLOWED HERE. Automatic analysis accepts plain paths only, so
# every entry below is a literal directory name — no **, no *.json. It also supports
# only these keys: sonar.sources, sonar.exclusions, sonar.inclusions, sonar.tests,
# sonar.test.exclusions, sonar.test.inclusions, sonar.sourceEncoding,
# sonar.cpd.exclusions, sonar.python.version.
#
# COVERAGE IS NOT CONFIGURED, AND CANNOT BE.
# Automatic analysis does not support test coverage at all. There is no property that
# would make it appear, so none is set here. A coverage figure on this project would
# have to come from a real scanner step in CI, and that does not exist yet. Read the
# absence of a coverage number as "not measured", never as "nothing covered".
#
# WHAT IS EXCLUDED, AND THE RULE THAT PICKED IT
# ----------------------------------------------
# Every directory listed below holds ZERO tracked .py files (verified 17 Aug 2026 with
# `git ls-files -- <dir> | grep '\.py$'`). They are runtime state and data the cycle
# writes — snapshots, ledgers, cached JSON, generated reports — not source anyone
# maintains. Excluding them removes noise, not findings.
#
# WHAT IS DELIBERATELY *NOT* EXCLUDED
# ------------------------------------
# memory/ is NOT on this list. The name suggests data, and most of what is on disk
# there is data, but it also holds 19 tracked modules — heartbeat.py, trend_tracker.py,
# context_injector.py, prediction_tracker.py, existence_ledger.py and others — that
# the cycle imports on every run, and that Sonar has raised real findings against.
# Excluding memory/ would raise the score without changing the code, which is hiding
# the number rather than earning it. Same reasoning keeps alignment/ (1 module) and
# safety/ (ast_gate.py, protected_paths.py, quarantine.py — the code that decides what
# self-modification may write) fully in scope.
#
# Before adding a directory here, run the count. One .py file disqualifies it.
#
# WHY test/ IS ON THE EXCLUSION LIST DESPITE BEING FULL OF .py FILES
# -------------------------------------------------------------------
# It is the one entry that does NOT follow the zero-.py rule above. sonar.sources
# defaults to '.', which already includes test/, so declaring sonar.tests=test put the
# same files in both roles. Automatic analysis did not degrade and did not warn — it
# REJECTED THE WHOLE RUN. Two attempts, both rejected, both verified on PR #6:
#
#   attempt 1  sonar.tests=test, test NOT in exclusions  -> "Source and test paths overlap"
#              analysis_id 20b0c68a-9088-47f2-8377-a964bae567ea
#              file       test/test_canon_boundaries.py
#
#   attempt 2  sonar.tests=test, test IN exclusions      -> same error, new analysis
#              analysis_id e0efdf77-c98b-4e3e-9429-041294b2dadb
#              file       test/test_need_class.py
#
# Attempt 2 is the informative one: under automatic analysis, sonar.exclusions does NOT
# remove a directory from sonar.sources for the purposes of the overlap check. Excluding
# test/ and declaring it as tests are not two compatible halves of one configuration —
# the second is simply unavailable here. So sonar.tests is gone, not merely reordered.
#
# THE CONSEQUENCE, STATED RATHER THAN BURIED
# -------------------------------------------
# test/ is now excluded outright and is NOT analysed by SonarCloud at all. 619 passing
# tests receive no static analysis. That is a real gap, not a tidy-up: the test suite is
# where this repo puts its guards — the AST gate's tests, the notary gate tripwire, the
# path-traversal containment tests — and none of that code is being read by the scanner.
#
# It is the price of getting any measurement at all on the other ~45k lines, because the
# alternative measured twice was a rejected analysis, which yields nothing. Worth naming
# for the same reason the failures above are named: a rejected analysis and a clean one
# look identical from outside if nobody opens the job — both are an absence of findings.
#
# The way to close it is CI-based analysis, where sonar.sources and sonar.tests both work
# and the two-role split is supported. Until then this file buys coverage of the source
# tree by giving up coverage of the tests, and that trade is recorded here on purpose.

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.exclusions=raw_data,output,daily,cortex_memory,snapshots,news,history,knowledge,data,journal,out,plans,reports,internet_requests,openclaw_queue,config,test
